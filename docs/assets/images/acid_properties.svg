<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
    <rect width="800" height="400" fill="#fdf4ff" />

    <!-- Title -->
    <text x="400" y="40" font-family="Arial" font-size="24" font-weight="bold" fill="#701a75" text-anchor="middle">TRANSAÇÕES: PROPRIEDADES A.C.I.D.</text>

    <!-- Center Icon -->
    <circle cx="400" cy="220" r="60" fill="white" stroke="#701a75" stroke-width="2" />
    <path d="M370,220 L400,250 L430,200" stroke="#701a75" stroke-width="4" fill="none" />
    <text x="400" y="300" font-family="Arial" font-size="14" fill="#701a75" text-anchor="middle">Banco Seguro</text>

    <!-- Atomicity -->
    <g transform="translate(150, 80)">
         <circle cx="50" cy="50" r="45" fill="#fae8ff" stroke="#d946ef" stroke-width="2" />
         <text x="50" y="55" font-family="Arial" font-size="16" font-weight="bold" fill="#86198f" text-anchor="middle">A</text>
         <text x="50" y="115" font-family="Arial" font-size="14" font-weight="bold" fill="#86198f" text-anchor="middle">Atomicidade</text>
         <text x="50" y="135" font-family="Arial" font-size="10" fill="#86198f" text-anchor="middle">Tudo ou Nada</text>
         <line x1="95" y1="95" x2="340" y2="200" stroke="#d946ef" stroke-width="2" stroke-dasharray="4" opacity="0.5" />
    </g>

    <!-- Consistency -->
    <g transform="translate(550, 80)">
         <circle cx="50" cy="50" r="45" fill="#fae8ff" stroke="#a21caf" stroke-width="2" />
         <text x="50" y="55" font-family="Arial" font-size="16" font-weight="bold" fill="#701a75" text-anchor="middle">C</text>
         <text x="50" y="115" font-family="Arial" font-size="14" font-weight="bold" fill="#701a75" text-anchor="middle">Consistência</text>
         <text x="50" y="135" font-family="Arial" font-size="10" fill="#701a75" text-anchor="middle">Regras Válidas</text>
         <line x1="5" y1="95" x2="400" y2="160" stroke="#a21caf" stroke-width="2" stroke-dasharray="4" opacity="0.5" />
    </g>

    <!-- Isolation -->
    <g transform="translate(150, 250)">
         <circle cx="50" cy="50" r="45" fill="#fae8ff" stroke="#c026d3" stroke-width="2" />
         <text x="50" y="55" font-family="Arial" font-size="16" font-weight="bold" fill="#86198f" text-anchor="middle">I</text>
         <text x="50" y="115" font-family="Arial" font-size="14" font-weight="bold" fill="#86198f" text-anchor="middle">Isolamento</text>
         <text x="50" y="135" font-family="Arial" font-size="10" fill="#86198f" text-anchor="middle">Independência</text>
         <line x1="95" y1="5" x2="340" y2="220" stroke="#c026d3" stroke-width="2" stroke-dasharray="4" opacity="0.5" />
    </g>

    <!-- Durability -->
    <g transform="translate(550, 250)">
         <circle cx="50" cy="50" r="45" fill="#fae8ff" stroke="#86198f" stroke-width="2" />
         <text x="50" y="55" font-family="Arial" font-size="16" font-weight="bold" fill="#4a044e" text-anchor="middle">D</text>
         <text x="50" y="115" font-family="Arial" font-size="14" font-weight="bold" fill="#4a044e" text-anchor="middle">Durabilidade</text>
         <text x="50" y="135" font-family="Arial" font-size="10" fill="#4a044e" text-anchor="middle">Salvo p/ Sempre</text>
         <line x1="5" y1="5" x2="400" y2="280" stroke="#86198f" stroke-width="2" stroke-dasharray="4" opacity="0.5" />
    </g>

</svg>
