<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
    <rect width="800" height="400" fill="#f8fafc" />

    <!-- Title -->
    <text x="400" y="40" font-family="Arial" font-size="24" font-weight="bold" fill="#0f172a" text-anchor="middle">SQL: DDL vs DML</text>

    <!-- DDL Section -->
    <g transform="translate(50, 80)">
        <rect width="320" height="280" rx="10" fill="white" stroke="#0f172a" stroke-width="2" />
        <path d="M0,50 L320,50" stroke="#0f172a" stroke-width="2" />
        <text x="160" y="35" font-family="Arial" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">DDL (Definição)</text>
        
        <!-- Code Block -->
        <rect x="20" y="70" width="280" height="120" rx="5" fill="#1e293b" />
        <text x="30" y="95" font-family="monospace" font-size="14" fill="#a5f3fc">CREATE TABLE</text>
        <text x="140" y="95" font-family="monospace" font-size="14" fill="#e2e8f0">Alunos (</text>
        <text x="40" y="120" font-family="monospace" font-size="14" fill="#e2e8f0">id INT PRIMARY KEY,</text>
        <text x="40" y="145" font-family="monospace" font-size="14" fill="#e2e8f0">nome VARCHAR(50)</text>
        <text x="30" y="170" font-family="monospace" font-size="14" fill="#e2e8f0">);</text>

        <!-- Visual representation of structure being built -->
        <g transform="translate(60, 210)">
             <rect width="200" height="50" rx="5" fill="#cbd5e1" stroke="#475569" stroke-dasharray="5,5" />
             <text x="100" y="30" font-family="Arial" font-size="14" fill="#475569" text-anchor="middle">Estrutura (Schema)</text>
             <path d="M-20,-10 L-20,60 M220,-10 L220,60" stroke="#f59e0b" stroke-width="2" /> <!-- Construction scaffolding -->
        </g>
    </g>

    <!-- DML Section -->
    <g transform="translate(430, 80)">
        <rect width="320" height="280" rx="10" fill="white" stroke="#059669" stroke-width="2" />
        <path d="M0,50 L320,50" stroke="#059669" stroke-width="2" />
        <text x="160" y="35" font-family="Arial" font-size="20" font-weight="bold" fill="#059669" text-anchor="middle">DML (Manipulação)</text>

        <!-- Code Block -->
        <rect x="20" y="70" width="280" height="120" rx="5" fill="#1e293b" />
        <text x="30" y="95" font-family="monospace" font-size="14" fill="#86efac">INSERT INTO</text>
        <text x="135" y="95" font-family="monospace" font-size="14" fill="#e2e8f0">Alunos</text>
        <text x="30" y="120" font-family="monospace" font-size="14" fill="#e2e8f0">VALUES (1, 'Ana');</text>
        <text x="30" y="150" font-family="monospace" font-size="14" fill="#86efac">UPDATE</text>
        <text x="90" y="150" font-family="monospace" font-size="14" fill="#e2e8f0">Alunos...</text>

        <!-- Visual representation of data flow -->
        <g transform="translate(60, 210)">
             <rect width="200" height="50" rx="5" fill="#d1fae5" stroke="#059669" />
             <text x="100" y="30" font-family="Arial" font-size="14" fill="#065f46" text-anchor="middle">Dados (Registros)</text>
             <circle cx="180" cy="10" r="10" fill="#10b981" /> <!-- New data particle -->
             <path d="M180,10 L180,25" stroke="white" stroke-width="2" />
        </g>
    </g>

    <!-- VS Badge -->
    <circle cx="400" cy="220" r="25" fill="#ef4444" stroke="white" stroke-width="4" />
    <text x="400" y="228" font-family="Arial" font-size="18" font-weight="bold" fill="white" text-anchor="middle">VS</text>

</svg>
